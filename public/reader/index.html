<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>線上書房</title>
<style>
  :root {
    --bg: #f7f3ea; --fg: #2b2620; --muted: #7a6f60; --line: #e2d9c6;
    --panel: #fffdf8; --accent: #9a4a1c;
    --font-size: 19px; --line-height: 1.9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]):not([data-theme="sepia"]) {
      --bg: #17161a; --fg: #d9d4ca; --muted: #8b857b; --line: #2c2a30;
      --panel: #1f1e23; --accent: #e09a62;
    }
  }
  :root[data-theme="light"] { --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --panel: #fafafa; --accent: #0a62c9; }
  :root[data-theme="dark"] { --bg: #17161a; --fg: #d9d4ca; --muted: #8b857b; --line: #2c2a30; --panel: #1f1e23; --accent: #e09a62; }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, "Noto Serif TC", "PMingLiU", serif;
    transition: background .2s, color .2s;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* 頂部進度條與工具列 */
  #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 30; }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    transition: transform .25s;
  }
  header.hidden { transform: translateY(-100%); }
  header .title { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .title small { color: var(--muted); margin-left: 6px; }
  header button { padding: 6px 10px; border-radius: 8px; font-size: 14px; }
  header button:hover { background: var(--line); }
  #pct { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* 正文 */
  main { max-width: 38em; margin: 0 auto; padding: 84px 16px 40vh; font-size: var(--font-size); line-height: var(--line-height); }
  main p { margin: 0 0 1em; text-align: justify; hyphens: auto; }
  main h1 { font-size: 2em; line-height: 1.3; text-align: center; margin: 1em 0 .2em; }
  main .byline { text-align: center; color: var(--muted); margin-bottom: 3em; }
  main h2 { font-size: 1.25em; text-align: center; margin: 3.5em 0 1.5em; letter-spacing: .08em; scroll-margin-top: 70px; }
  main h2::after { content: ""; display: block; width: 40px; height: 1px; background: var(--muted); margin: .8em auto 0; }
  main pre { white-space: pre-wrap; font: inherit; margin: 0 0 1em 2em; font-style: italic; }
  .end { text-align: center; color: var(--muted); margin-top: 4em; }
  .notice { font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.7; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .notice code { background: var(--line); padding: 2px 6px; border-radius: 4px; }

  /* 側邊抽屜（目錄 / 書架 / 設定）*/
  .drawer {
    position: fixed; top: 0; bottom: 0; right: 0; width: min(340px, 88vw); z-index: 40;
    background: var(--panel); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .25s; overflow-y: auto;
    font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    padding: 16px;
  }
  .drawer.open { transform: none; }
  .drawer h3 { margin: 4px 0 12px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
  .drawer ol, .drawer ul { list-style: none; margin: 0; padding: 0; }
  .drawer li button { width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: 15px; }
  .drawer li button:hover, .drawer li button.active { background: var(--line); }
  .drawer li button.active { color: var(--accent); font-weight: 600; }
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 35; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #scrim.show { opacity: 1; pointer-events: auto; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 0; font-size: 14px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { padding: 6px 12px; font-size: 14px; }
  .seg button.on { background: var(--accent); color: #fff; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.6; }
  label.file { display: block; text-align: center; padding: 10px; border: 1px dashed var(--muted); border-radius: 8px; cursor: pointer; font-size: 14px; margin-top: 12px; }
  label.file input { display: none; }
</style>
</head>
<body>
<div id="progress"></div>
<header id="bar">
  <button id="btnShelf" aria-label="書架">📚</button>
  <div class="title" id="barTitle">線上書房</div>
  <span id="pct">0%</span>
  <button id="btnToc">目錄</button>
  <button id="btnSet" aria-label="設定">Aa</button>
</header>

<main id="book"></main>

<div id="scrim"></div>
<aside class="drawer" id="toc"><h3>目錄 <button data-close>✕</button></h3><ol id="tocList"></ol></aside>
<aside class="drawer" id="shelf">
  <h3>書架 <button data-close>✕</button></h3>
  <ul id="shelfList"></ul>
  <label class="file">＋ 開啟電腦裡的 .txt 電子書<input type="file" id="fileInput" accept=".txt,text/plain"></label>
  <p class="hint">本機開啟的書只在這個瀏覽器裡閱讀，不會上傳。</p>
</aside>
<aside class="drawer" id="settings">
  <h3>閱讀設定 <button data-close>✕</button></h3>
  <div class="row">字體大小
    <div class="seg"><button data-font="-1">A−</button><button data-font="1">A＋</button></div>
  </div>
  <div class="row">行距
    <div class="seg" id="lhSeg"><button data-lh="1.6">緊</button><button data-lh="1.9">中</button><button data-lh="2.3">鬆</button></div>
  </div>
  <div class="row">主題
    <div class="seg" id="themeSeg"><button data-theme="sepia">米黃</button><button data-theme="light">白</button><button data-theme="dark">夜間</button></div>
  </div>
  <p class="hint">往下滑就能一路讀完整本書。往下捲動時工具列會自動隱藏，往上滑就會再出現。閱讀位置會自動記住。</p>
</aside>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const root = document.documentElement;
  const book = $('#book');
  let current = null;      // { id, title, author }
  let headings = [];

  /* ---------- 設定 ---------- */
  const prefs = Object.assign({ font: 19, lh: 1.9, theme: null }, store.get('reader:prefs', {}));
  function applyPrefs() {
    root.style.setProperty('--font-size', prefs.font + 'px');
    root.style.setProperty('--line-height', prefs.lh);
    if (prefs.theme) root.dataset.theme = prefs.theme; else delete root.dataset.theme;
    document.querySelectorAll('#lhSeg button').forEach((b) => b.classList.toggle('on', +b.dataset.lh === prefs.lh));
    document.querySelectorAll('#themeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.theme === (prefs.theme || 'sepia')));
    store.set('reader:prefs', prefs);
  }
  document.querySelectorAll('[data-font]').forEach((b) => b.onclick = () => keepPosition(() => {
    prefs.font = Math.min(30, Math.max(14, prefs.font + +b.dataset.font)); applyPrefs();
  }));
  document.querySelectorAll('[data-lh]').forEach((b) => b.onclick = () => keepPosition(() => { prefs.lh = +b.dataset.lh; applyPrefs(); }));
  document.querySelectorAll('#themeSeg button').forEach((b) => b.onclick = () => { prefs.theme = b.dataset.theme; applyPrefs(); });
  applyPrefs();

  // 改字體大小時，維持在同一段落
  function keepPosition(fn) {
    const ratio = scrollRatio(); fn();
    requestAnimationFrame(() => scrollTo({ top: ratio * maxScroll(), behavior: 'instant' }));
  }

  /* ---------- 抽屜 ---------- */
  const drawers = ['#toc', '#shelf', '#settings'].map((s) => $(s));
  function openDrawer(el) { drawers.forEach((d) => d.classList.toggle('open', d === el)); $('#scrim').classList.add('show'); }
  function closeDrawers() { drawers.forEach((d) => d.classList.remove('open')); $('#scrim').classList.remove('show'); }
  $('#btnToc').onclick = () => openDrawer($('#toc'));
  $('#btnShelf').onclick = () => openDrawer($('#shelf'));
  $('#btnSet').onclick = () => openDrawer($('#settings'));
  $('#scrim').onclick = closeDrawers;
  document.querySelectorAll('[data-close]').forEach((b) => b.onclick = closeDrawers);
  addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawers(); });

  /* ---------- 文字解析 ---------- */
  const CHAPTER_RE = /^\s*(chapter\s+[ivxlcdm\d]+\.?|第[一二三四五六七八九十百零〇\d]+[章回節卷].*|序[章言]?|楔子|尾聲|後記|appendix.*|preface.*)\s*$/i;
  function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function render(text, meta) {
    text = text.replace(/\r\n?/g, '\n').replace(/^﻿/, '');
    const blocks = text.split(/\n\s*\n/);
    let html = `<h1>${escapeHtml(meta.title)}</h1>` + (meta.author ? `<div class="byline">${escapeHtml(meta.author)}</div>` : '');
    let n = 0;
    for (let raw of blocks) {
      raw = raw.replace(/^\n+|\s+$/g, '');
      if (!raw.trim()) continue;
      const one = raw.trim();
      if (!one.includes('\n') && CHAPTER_RE.test(one)) {
        html += `<h2 id="ch${n++}">${escapeHtml(one)}</h2>`;
      } else if (/^ {2,}\S/m.test(raw) && raw.split('\n').every((l) => /^ {2,}|^$/.test(l))) {
        html += `<pre>${escapeHtml(raw.replace(/^ +/gm, ''))}</pre>`;   // 縮排區塊（歌詞、詩句）
      } else {
        html += `<p>${escapeHtml(raw.replace(/\s*\n\s*/g, ' '))}</p>`;
      }
    }
    html += '<p class="end">— 全書完 —</p>';
    book.innerHTML = html;
    headings = [...book.querySelectorAll('h2')];
    $('#tocList').innerHTML = headings.length
      ? headings.map((h, i) => `<li><button data-i="${i}">${h.textContent}</button></li>`).join('')
      : '<li class="hint">這本書沒有偵測到章節標題。</li>';
    $('#tocList').querySelectorAll('button').forEach((b) => b.onclick = () => {
      closeDrawers(); headings[+b.dataset.i].scrollIntoView({ behavior: 'smooth' });
    });
    $('#barTitle').innerHTML = escapeHtml(meta.title) + (meta.author ? `<small>${escapeHtml(meta.author)}</small>` : '');
    document.title = meta.title + '｜線上書房';
    current = meta;
    store.set('reader:last', meta.id);
    const saved = store.get('reader:pos:' + meta.id, 0);
    requestAnimationFrame(() => { scrollTo({ top: saved * maxScroll(), behavior: 'instant' }); onScroll(); });
  }

  function showNotice(html) {
    book.innerHTML = `<div class="notice">${html}</div>`;
    headings = []; $('#tocList').innerHTML = ''; current = null;
  }

  /* ---------- 書架 ---------- */
  let library = [];
  async function loadLibrary() {
    try {
      const r = await fetch('books/index.json', { cache: 'no-cache' });
      library = (await r.json()).books || [];
    } catch { library = []; }
    $('#shelfList').innerHTML = library.map((b) =>
      `<li><button data-id="${b.id}">${escapeHtml(b.title)}<br><span class="hint">${escapeHtml(b.author || '')}</span></button></li>`).join('');
    $('#shelfList').querySelectorAll('button').forEach((btn) => btn.onclick = () => { closeDrawers(); openBook(btn.dataset.id); });
  }

  async function openBook(id) {
    const meta = library.find((b) => b.id === id);
    if (!meta) return;
    history.replaceState(null, '', '#' + id);
    try {
      const r = await fetch('books/' + meta.file, { cache: 'no-cache' });
      if (!r.ok) throw new Error(r.status);
      const text = await r.text();
      if (!text.trim()) throw new Error('empty');
      render(text, meta);
    } catch {
      showNotice(`<b>《${escapeHtml(meta.title)}》的內文檔案還沒放進來。</b><br><br>
        請在專案根目錄執行：<br><code>node scripts/fetch-animal-farm.mjs</code><br><br>
        它會把公有領域的原文下載到 <code>public/reader/books/${escapeHtml(meta.file)}</code>。
        或者，你也可以從左上角 📚 書架用「開啟電腦裡的 .txt 電子書」直接讀本機檔案。`);
    }
  }

  $('#fileInput').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const buf = await f.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('�')) { try { text = new TextDecoder('big5').decode(buf); } catch {} }  // 舊的繁中 txt 常是 Big5
    closeDrawers();
    render(text, { id: 'local:' + f.name, title: f.name.replace(/\.txt$/i, ''), author: '' });
  };

  /* ---------- 捲動：進度、記憶位置、自動隱藏工具列 ---------- */
  const maxScroll = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);
  const scrollRatio = () => Math.min(1, scrollY / maxScroll());
  let lastY = 0, saveTimer;
  function onScroll() {
    const r = scrollRatio();
    $('#progress').style.width = (r * 100) + '%';
    $('#pct').textContent = Math.round(r * 100) + '%';
    $('#bar').classList.toggle('hidden', scrollY > lastY && scrollY > 120);
    lastY = scrollY;
    // 目前章節
    let idx = -1;
    for (let i = 0; i < headings.length; i++) if (headings[i].getBoundingClientRect().top < innerHeight * 0.4) idx = i;
    $('#tocList').querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === idx));
    if (current) { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set('reader:pos:' + current.id, r), 300); }
  }
  addEventListener('scroll', onScroll, { passive: true });
  book.addEventListener('click', () => $('#bar').classList.toggle('hidden'));   // 點一下正文，切換工具列

  loadLibrary().then(() => {
    const want = location.hash.slice(1) || store.get('reader:last', null);
    const id = library.some((b) => b.id === want) ? want : library[0]?.id;
    if (id) openBook(id); else showNotice('書架是空的。');
  });
})();
</script>
</body>
</html>
