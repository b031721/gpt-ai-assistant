<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>捲軸書房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  /* 版面：單欄長卷，頁面就是一條可以一直往下捲的紙；工具在頂端，抽屜從右邊滑出 */
  :root {
    --paper: #f3efe6; --ink: #262420; --faint: #77705f; --rule: #ddd5c3;
    --sheet: #fbf9f3; --seal: #a33a26; --on-seal: #ffffff;
    --font-body: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
    --font-ui: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    --size: 19px; --lead: 1.9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #18191b; --ink: #d8d4cb; --faint: #8a857a; --rule: #2d2e31;
      --sheet: #212225; --seal: #e07a5f; --on-seal: #18191b; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #18191b; --ink: #d8d4cb; --faint: #8a857a; --rule: #2d2e31;
    --sheet: #212225; --seal: #e07a5f; --on-seal: #18191b; color-scheme: dark;
  }
  /* 讀者自選的紙色，蓋過系統主題 */
  :root[data-paper="sepia"] {
    --paper: #f3efe6; --ink: #262420; --faint: #77705f; --rule: #ddd5c3;
    --sheet: #fbf9f3; --seal: #a33a26; --on-seal: #ffffff; color-scheme: light;
  }
  :root[data-paper="white"] {
    --paper: #ffffff; --ink: #1c1c1e; --faint: #6c6c70; --rule: #e4e4e8;
    --sheet: #f7f7f9; --seal: #a33a26; --on-seal: #ffffff; color-scheme: light;
  }
  :root[data-paper="night"] {
    --paper: #18191b; --ink: #d8d4cb; --faint: #8a857a; --rule: #2d2e31;
    --sheet: #212225; --seal: #e07a5f; --on-seal: #18191b; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); transition: background .2s, color .2s; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, label:focus-within { outline: 2px solid var(--seal); outline-offset: 2px; }

  #progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; width: 0; background: var(--seal); z-index: 30; }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; gap: 4px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
    background: color-mix(in srgb, var(--paper) 90%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rule); font-family: var(--font-ui);
    transition: transform .25s;
  }
  header.hidden { transform: translateY(-110%); }
  header .title { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  header button { padding: 7px 10px; border-radius: 8px; font-size: 14px; white-space: nowrap; }
  header button:hover { background: var(--rule); }
  #pct { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }

  main {
    max-width: 36em; margin: 0 auto; font-size: var(--size); line-height: var(--lead);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 84px 40vh;
  }
  main p { margin: 0 0 1em; text-align: justify; text-indent: var(--indent, 0); overflow-wrap: anywhere; }
  main.cjk { --indent: 2em; }
  main h1 { font-size: 1.9em; line-height: 1.35; text-align: center; margin: 1.2em 0 .2em; text-wrap: balance; }
  main .byline { text-align: center; color: var(--faint); margin-bottom: 3em; font-size: .9em; }
  main h2 { font-size: 1.2em; text-align: center; margin: 3.5em 0 1.5em; letter-spacing: .08em; scroll-margin-top: 72px; text-wrap: balance; }
  main h2::after { content: ""; display: block; width: 36px; height: 2px; background: var(--seal); margin: .7em auto 0; opacity: .7; }
  main blockquote { margin: 0 0 1em 1.5em; color: var(--faint); }
  main img { display: block; max-width: 100%; height: auto; margin: 1.5em auto; }
  .end { text-align: center; color: var(--faint); margin-top: 4em; text-indent: 0 !important; }

  /* 歡迎頁（書架空的時候）*/
  .welcome { font-family: var(--font-ui); font-size: 16px; line-height: 1.7; }
  .welcome h1 { font-family: var(--font-body); }
  .welcome ol { padding-left: 1.4em; display: grid; gap: .8em; margin: 1.5em 0; }
  .welcome .add { position: relative; overflow: hidden; display: inline-block; background: var(--seal); color: var(--on-seal); padding: 12px 22px; border-radius: 999px; font-weight: 600; cursor: pointer; }
  .welcome .note { color: var(--faint); font-size: 14px; }
  .welcome .center { text-align: center; margin: 2em 0; }
  .welcome a { color: var(--seal); }

  .drawer {
    position: fixed; top: 0; bottom: 0; right: 0; width: min(340px, 90vw); z-index: 40;
    background: var(--sheet); border-left: 1px solid var(--rule);
    transform: translateX(105%); transition: transform .25s; overflow-y: auto;
    font-family: var(--font-ui);
    padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) 16px;
  }
  .drawer.open { transform: none; }
  .drawer h3 { margin: 0 0 12px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
  .drawer h3 button { padding: 4px 8px; }
  .drawer ol, .drawer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .drawer li { display: flex; align-items: stretch; }
  .drawer li > button:first-child { flex: 1; min-width: 0; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: 15px; line-height: 1.4; }
  .drawer li > button:first-child:hover, .drawer li > button.active { background: var(--rule); }
  .drawer li > button.active { color: var(--seal); font-weight: 600; }
  .drawer .del { color: var(--faint); padding: 0 10px; font-size: 13px; }
  .drawer .del:hover { color: var(--seal); }
  .sub { display: block; color: var(--faint); font-size: 12px; margin-top: 2px; }
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 35; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #scrim.show { opacity: 1; pointer-events: auto; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0; font-size: 14px; flex-wrap: wrap; }
  .seg { display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .seg button { padding: 6px 12px; font-size: 14px; }
  .seg button.on { background: var(--seal); color: var(--on-seal); }
  .hint { color: var(--faint); font-size: 13px; line-height: 1.6; }
  label.file { position: relative; overflow: hidden; display: block; text-align: center; padding: 12px; border: 1px dashed var(--faint); border-radius: 8px; cursor: pointer; font-size: 14px; margin-top: 14px; }
  .picker { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 200px; }
  #status { font-family: var(--font-ui); font-size: 15px; line-height: 1.7; color: var(--ink); text-align: center; min-height: 1.5em; }
  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); font-family: var(--font-ui); font-size: 14px; padding: 10px 16px; border-radius: 8px; z-index: 50; max-width: calc(100vw - 32px); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="progress"></div>
<header id="bar">
  <button id="btnShelf">書架</button>
  <div class="title" id="barTitle">捲軸書房</div>
  <span id="pct"></span>
  <button id="btnToc">目錄</button>
  <button id="btnSet" aria-label="閱讀設定">Aa</button>
</header>


<main id="book"></main>

<div id="scrim"></div>
<aside class="drawer" id="toc" aria-label="目錄"><h3>目錄 <button data-close aria-label="關閉">✕</button></h3><ol id="tocList"></ol></aside>
<aside class="drawer" id="shelf" aria-label="書架">
  <h3>書架 <button data-close aria-label="關閉">✕</button></h3>
  <ul id="shelfList"></ul>
  <label class="file">＋ 加入一本書（epub 或 txt）<input type="file" class="picker" id="pickShelf" aria-label="加入一本書"></label>
  <p class="hint">書只存在這個瀏覽器裡，不會上傳到任何地方。換手機或清除瀏覽資料後需要重新加入。</p>
</aside>
<aside class="drawer" id="settings" aria-label="閱讀設定">
  <h3>閱讀設定 <button data-close aria-label="關閉">✕</button></h3>
  <div class="row">字體大小
    <div class="seg"><button data-font="-1">A−</button><button data-font="1">A＋</button></div>
  </div>
  <div class="row">行距
    <div class="seg" id="lhSeg"><button data-lh="1.6">緊</button><button data-lh="1.9">中</button><button data-lh="2.3">鬆</button></div>
  </div>
  <div class="row">紙色
    <div class="seg" id="paperSeg"><button data-paper="">跟隨系統</button><button data-paper="sepia">米黃</button><button data-paper="white">白</button><button data-paper="night">夜間</button></div>
  </div>
  <p class="hint">一直往下滑就能讀完整本書。往下讀時工具列會自動收起，往上滑一點或點一下文字就會出現。閱讀位置會自動記住。</p>
</aside>
<div id="toast" hidden></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const root = document.documentElement;
  const book = $('#book');
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let current = null;
  let headings = [];

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 3200);
  }

  /* ---------- 本機書庫（IndexedDB）---------- */
  const db = {
    open() {
      if (this.p) return this.p;
      this.p = new Promise((resolve) => {
        try {
          const req = indexedDB.open('reader', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('books', { keyPath: 'id' });
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch { resolve(null); }
      });
      return this.p;
    },
    async run(mode, fn) {
      const d = await this.open(); if (!d) return null;
      return new Promise((resolve) => {
        try {
          const tx = d.transaction('books', mode); const r = fn(tx.objectStore('books'));
          tx.oncomplete = () => resolve(r && r.result); tx.onerror = () => resolve(null);
        } catch { resolve(null); }
      });
    },
    all() { return this.run('readonly', (s) => s.getAll()); },
    get(id) { return this.run('readonly', (s) => s.get(id)); },
    put(b) { return this.run('readwrite', (s) => s.put(b)); },
    del(id) { return this.run('readwrite', (s) => s.delete(id)); },
  };

  /* ---------- 閱讀設定 ---------- */
  const prefs = Object.assign({ font: 19, lh: 1.9, paper: '' }, store.get('reader:prefs', {}));
  function applyPrefs() {
    root.style.setProperty('--size', prefs.font + 'px');
    root.style.setProperty('--lead', prefs.lh);
    if (prefs.paper) root.dataset.paper = prefs.paper; else delete root.dataset.paper;
    document.querySelectorAll('#lhSeg button').forEach((b) => b.classList.toggle('on', +b.dataset.lh === prefs.lh));
    document.querySelectorAll('#paperSeg button').forEach((b) => b.classList.toggle('on', b.dataset.paper === prefs.paper));
    store.set('reader:prefs', prefs);
  }
  function keepPosition(fn) {
    const r = scrollRatio(); fn();
    requestAnimationFrame(() => scrollTo({ top: r * maxScroll(), behavior: 'instant' }));
  }
  document.querySelectorAll('[data-font]').forEach((b) => { b.onclick = () => keepPosition(() => { prefs.font = Math.min(32, Math.max(14, prefs.font + +b.dataset.font)); applyPrefs(); }); });
  document.querySelectorAll('[data-lh]').forEach((b) => { b.onclick = () => keepPosition(() => { prefs.lh = +b.dataset.lh; applyPrefs(); }); });
  document.querySelectorAll('#paperSeg button').forEach((b) => { b.onclick = () => { prefs.paper = b.dataset.paper; applyPrefs(); }; });
  applyPrefs();

  /* ---------- 抽屜 ---------- */
  const drawers = ['#toc', '#shelf', '#settings'].map((s) => $(s));
  const openDrawer = (el) => { drawers.forEach((d) => d.classList.toggle('open', d === el)); $('#scrim').classList.add('show'); };
  const closeDrawers = () => { drawers.forEach((d) => d.classList.remove('open')); $('#scrim').classList.remove('show'); };
  $('#btnToc').onclick = () => openDrawer($('#toc'));
  $('#btnShelf').onclick = () => openDrawer($('#shelf'));
  $('#btnSet').onclick = () => openDrawer($('#settings'));
  $('#scrim').onclick = closeDrawers;
  document.querySelectorAll('[data-close]').forEach((b) => { b.onclick = closeDrawers; });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawers(); });

  /* ---------- txt 轉 HTML ---------- */
  const CHAPTER_RE = /^\s*(chapter\s+[ivxlcdm\d]+\.?.*|第[一二三四五六七八九十百千零〇兩\d]+[章回節卷部篇].{0,30}|[序楔]子|序[章言幕]?|尾聲|後記|附錄.*|preface.*|appendix.*)\s*$/i;
  function txtToHtml(text) {
    text = text.replace(/\r\n?/g, '\n').replace(/^﻿/, '');
    // 中文 txt 常常一行一段、沒有空行
    const blocks = /\n\s*\n/.test(text) && text.split(/\n\s*\n/).length > text.split('\n').length / 4
      ? text.split(/\n\s*\n/) : text.split('\n');
    let html = '';
    for (const raw of blocks) {
      const t = raw.trim(); if (!t) continue;
      if (!t.includes('\n') && CHAPTER_RE.test(t)) html += `<h2>${esc(t)}</h2>`;
      else if (/^ {2,}\S/.test(raw) && raw.split('\n').every((l) => /^ {2,}|^$/.test(l))) html += `<blockquote>${raw.trim().split(/\n\s*/).map(esc).join('<br>')}</blockquote>`;
      else html += `<p>${esc(t.replace(/\s*\n\s*/g, ' '))}</p>`;
    }
    return html;
  }

  /* ---------- epub 轉 HTML ---------- */
  const resolvePath = (base, rel) => decodeURIComponent(new URL(rel, 'http://x/' + base).pathname.slice(1));
  const MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp' };
  const BLOCK = new Set(['p', 'div', 'section', 'article', 'blockquote', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'ul', 'ol', 'li', 'table', 'tr', 'td', 'figure', 'center', 'body', 'main', 'aside', 'header', 'footer', 'nav', 'dl', 'dd', 'dt', 'hr', 'pre']);

  async function epubToBook(file) {
    if (!window.JSZip) throw new Error('需要網路連線才能讀 epub，請確認已連上網路後再試一次。');
    const zip = await JSZip.loadAsync(file);
    const readText = async (p) => { const f = zip.file(p); if (!f) throw new Error('epub 缺少檔案：' + p); return f.async('string'); };
    const parse = (s, type) => new DOMParser().parseFromString(s, type);
    const container = parse(await readText('META-INF/container.xml'), 'application/xml');
    const opfPath = container.querySelector('rootfile').getAttribute('full-path');
    const opf = parse(await readText(opfPath), 'application/xml');
    const meta = (tag) => (opf.getElementsByTagName('dc:' + tag)[0] || opf.getElementsByTagNameNS('*', tag)[0])?.textContent.trim() || '';
    const manifest = {};
    for (const it of opf.getElementsByTagNameNS('*', 'item')) manifest[it.getAttribute('id')] = { href: resolvePath(opfPath, it.getAttribute('href')), type: it.getAttribute('media-type') || '' };
    const spine = [...opf.getElementsByTagNameNS('*', 'itemref')].map((r) => manifest[r.getAttribute('idref')]).filter((m) => m && /html|xml/.test(m.type));

    const imgCache = {};
    async function imgSrc(base, src) {
      const p = resolvePath(base, src);
      if (!(p in imgCache)) {
        const f = zip.file(p);
        imgCache[p] = f ? `data:${MIME[p.split('.').pop().toLowerCase()] || 'image/jpeg'};base64,${await f.async('base64')}` : '';
      }
      return imgCache[p];
    }
    async function inline(node, base) {
      let out = '';
      for (const c of node.childNodes) {
        if (c.nodeType === 3) { out += esc(c.textContent.replace(/\s+/g, ' ')); continue; }
        if (c.nodeType !== 1) continue;
        const tag = c.localName.toLowerCase();
        if (tag === 'br') out += '<br>';
        else if (tag === 'img' || tag === 'image') {
          const s = await imgSrc(base, c.getAttribute('src') || c.getAttribute('xlink:href') || c.getAttributeNS('http://www.w3.org/1999/xlink', 'href') || '');
          if (s) out += `<img src="${s}" alt="">`;
        } else if (tag === 'rt' || tag === 'rp' || tag === 'script' || tag === 'style') { /* 略過注音、程式碼 */ }
        else if (['em', 'i', 'strong', 'b'].includes(tag)) out += `<${tag}>${await inline(c, base)}</${tag}>`;
        else out += await inline(c, base);
      }
      return out;
    }
    const hasBlock = (el) => [...el.children].some((c) => BLOCK.has(c.localName.toLowerCase()) || c.querySelector?.('p,div,h1,h2,h3,h4,h5,h6'));
    async function blocks(el, base) {
      let out = '';
      for (const c of el.children) {
        const tag = c.localName.toLowerCase();
        if (/^h[1-6]$/.test(tag)) { const t = c.textContent.replace(/\s+/g, ' ').trim(); if (t) out += `<h2>${esc(t)}</h2>`; }
        else if (tag === 'script' || tag === 'style' || tag === 'hr') continue;
        else if (tag === 'blockquote') out += `<blockquote>${await inline(c, base)}</blockquote>`;
        else if (BLOCK.has(tag) && hasBlock(c)) out += await blocks(c, base);
        else { const h = (await inline(c, base)).trim(); if (h && h !== '<br>') out += `<p>${h}</p>`; }
      }
      return out;
    }
    let html = '';
    for (const item of spine) {
      const doc = parse(await readText(item.href), 'application/xhtml+xml');
      const body = doc.body || doc.getElementsByTagName('body')[0] || parse(await readText(item.href), 'text/html').body;
      if (body) html += await blocks(body, item.href);
    }
    return { title: meta('title') || file.name.replace(/\.epub$/i, ''), author: meta('creator'), html };
  }

  /* ---------- 加入書 ---------- */
  const status = (msg) => { const el = $('#status'); if (el) el.textContent = msg; toast(msg); };
  let busy = false;
  async function onPick(e) {
    if (!e.target.matches || !e.target.matches('input.picker')) return;
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f || busy) return;
    busy = true;
    closeDrawers();
    status(`正在讀取「${f.name}」…`);
    try {
      let b;
      // 有些手機給的檔名沒有副檔名，所以也看檔頭：epub 是 zip，開頭是 "PK"
      const head = new Uint8Array(await f.slice(0, 2).arrayBuffer());
      const isZip = head[0] === 0x50 && head[1] === 0x4b;
      if (isZip || /\.epub$/i.test(f.name) || f.type === 'application/epub+zip') {
        b = await epubToBook(f);
      } else if (/\.(txt|text)$/i.test(f.name) || f.type.startsWith('text/') || !f.type) {
        const buf = await f.arrayBuffer();
        let text = new TextDecoder('utf-8').decode(buf);
        if ((text.match(/\uFFFD/g) || []).length > 3) { try { text = new TextDecoder('big5').decode(buf); } catch {} }
        b = { title: f.name.replace(/\.[^.]+$/, ''), author: '', html: txtToHtml(text) };
      } else {
        status(`「${f.name}」不是 epub 或 txt 檔。請到好讀選「下載 epub 檔」。`);
        return;
      }
      if (!b.html.trim()) { status('這本書讀不到文字內容。'); return; }
      b.id = 'b' + Date.now().toString(36);
      b.addedAt = Date.now();
      const saved = await db.put(b);
      if (saved === null) toast('這個瀏覽器不能存書，關掉頁面後要重新加入。');
      else toast(`已加入《${b.title}》`);
      memory[b.id] = b;
      await refreshShelf();
      openBook(b.id);
    } catch (err) {
      console.error(err);
      status('讀取失敗：' + (err.message || err));
    } finally {
      busy = false;
    }
  }
  document.addEventListener('change', onPick);
  document.addEventListener('input', onPick);

  // 有些 App 內建的瀏覽器（例如 Claude App 的預覽畫面）點了檔案欄位不會打開選檔畫面。
  // 選檔畫面一打開，頁面就會失去焦點；1.5 秒內都沒有，就提示改用一般瀏覽器開啟。
  let pickTimer;
  const cancelPickHint = () => clearTimeout(pickTimer);
  document.addEventListener('click', (e) => {
    if (!e.target.matches || !e.target.matches('input.picker')) return;
    cancelPickHint();
    pickTimer = setTimeout(() => {
      if (document.hasFocus() && !document.hidden) {
        const msg = '沒有跳出選檔畫面嗎？你可能是在 App 裡面打開這個網頁，它不支援選擇檔案。請按右上角的分享按鈕複製連結，貼到 Chrome 或 Safari 打開，再按一次「加入一本書」。';
        const el = $('#status');
        if (el) el.textContent = msg; else toast(msg);
      }
    }, 1500);
  }, true);
  addEventListener('blur', cancelPickHint);
  document.addEventListener('visibilitychange', cancelPickHint);
  document.addEventListener('change', cancelPickHint, true);

  /* ---------- 書架 ---------- */
  const memory = {};   // IndexedDB 不能用時的備援
  let shelf = [];
  async function serverBooks() {
    try {
      const r = await fetch('books/index.json', { cache: 'no-cache' });
      return r.ok ? ((await r.json()).books || []).map((b) => ({ ...b, server: true })) : [];
    } catch { return []; }
  }
  let serverList = null;
  async function refreshShelf() {
    if (!serverList) serverList = await serverBooks();
    const local = (await db.all()) || [];
    const merged = [...local, ...Object.values(memory).filter((m) => !local.some((l) => l.id === m.id))]
      .sort((a, b) => b.addedAt - a.addedAt).map(({ id, title, author }) => ({ id, title, author }));
    shelf = [...merged, ...serverList];
    $('#shelfList').innerHTML = shelf.length ? shelf.map((b) => `<li>
        <button data-id="${esc(b.id)}" class="${current && current.id === b.id ? 'active' : ''}">${esc(b.title)}${b.author ? `<span class="sub">${esc(b.author)}</span>` : ''}</button>
        ${b.server ? '' : `<button class="del" data-del="${esc(b.id)}" aria-label="從書架移除">移除</button>`}
      </li>`).join('') : '<li class="hint">書架還是空的。</li>';
    $('#shelfList').querySelectorAll('[data-id]').forEach((btn) => { btn.onclick = () => { closeDrawers(); openBook(btn.dataset.id); }; });
    $('#shelfList').querySelectorAll('[data-del]').forEach((btn) => {
      btn.onclick = async () => {
        if (btn.dataset.armed !== '1') { btn.dataset.armed = '1'; btn.textContent = '確定？'; return; }
        const id = btn.dataset.del;
        await db.del(id); delete memory[id];
        if (current && current.id === id) { current = null; welcome(); }
        refreshShelf();
      };
    });
  }

  async function openBook(id) {
    const entry = shelf.find((b) => b.id === id);
    if (!entry) { welcome(); return; }
    let b;
    if (entry.server) {
      try {
        const r = await fetch('books/' + entry.file, { cache: 'no-cache' });
        const text = r.ok ? await r.text() : '';
        if (!text.trim()) throw new Error('missing');
        b = { ...entry, html: /\.html?$/.test(entry.file) ? text : txtToHtml(text) };
      } catch {
        welcome(`《${entry.title}》的內文檔案還沒放到伺服器上。你可以先用下面的方法，從自己的手機加入這本書。`);
        return;
      }
    } else {
      b = memory[id] || await db.get(id);
      if (!b) { welcome(); return; }
    }
    render(b);
  }

  function render(b) {
    current = { id: b.id, title: b.title };
    store.set('reader:last', b.id);
    book.className = /[一-鿿]/.test(b.html.slice(0, 4000)) ? 'cjk' : '';
    book.innerHTML = `<h1>${esc(b.title)}</h1>${b.author ? `<div class="byline">${esc(b.author)}</div>` : ''}${b.html}<p class="end">— 全書完 —</p>`;
    headings = [...book.querySelectorAll('h2')];
    headings.forEach((h, i) => { h.id = 'ch' + i; });
    $('#tocList').innerHTML = headings.length
      ? headings.map((h, i) => `<li><button data-i="${i}">${esc(h.textContent)}</button></li>`).join('')
      : '<li class="hint">這本書沒有偵測到章節標題。</li>';
    $('#tocList').querySelectorAll('button').forEach((btn) => { btn.onclick = () => { closeDrawers(); headings[+btn.dataset.i].scrollIntoView({ behavior: 'smooth' }); }; });
    $('#barTitle').textContent = b.title;
    document.title = b.title + '｜捲軸書房';
    refreshShelf();
    const pos = store.get('reader:pos:' + b.id, 0);
    requestAnimationFrame(() => { scrollTo({ top: pos * maxScroll(), behavior: 'instant' }); onScroll(); });
  }

  function welcome(lead) {
    current = null; headings = [];
    $('#tocList').innerHTML = '<li class="hint">先加入一本書。</li>';
    $('#barTitle').textContent = '捲軸書房';
    document.title = '捲軸書房';
    book.className = '';
    book.innerHTML = `<div class="welcome">
      <h1>捲軸書房</h1>
      <p class="byline">不用翻頁，一路往下滑就能讀完整本書。</p>
      ${lead ? `<p>${esc(lead)}</p>` : ''}
      <ol>
        <li>到 <a href="https://www.haodoo.net/" target="_blank" rel="noopener">好讀</a> 找到想看的書（例如喬治・歐威爾的《動物農莊》），按 <b>「下載 epub 檔」</b>。直式或橫式都可以，在這裡都會變成橫排閱讀。</li>
        <li>回到這個頁面，按下面的 <b>「加入一本書」</b>，選剛剛下載的 .epub 檔。手機上通常在「下載」資料夾裡。</li>
        <li>開始往下滑。上方「目錄」可以跳章節，「Aa」可以調字體大小和紙色，閱讀位置會自動記住。</li>
      </ol>
      <p class="center"><label class="add">＋ 加入一本書<input type="file" class="picker" id="pickWelcome" aria-label="加入一本書"></label></p>
      <p id="status" role="status"></p>
      <p class="note">支援 epub 和 txt。好讀的 updb、prc、mobi 是給其他閱讀器用的格式，這裡讀不了，請選 epub。書只存在你這台裝置的瀏覽器裡，不會上傳。</p>
    </div>`;
    onScroll();
  }

  /* ---------- 捲動 ---------- */
  const maxScroll = () => Math.max(1, root.scrollHeight - innerHeight);
  const scrollRatio = () => Math.min(1, Math.max(0, scrollY / maxScroll()));
  let lastY = 0, saveTimer;
  function onScroll() {
    const r = scrollRatio();
    $('#progress').style.width = current ? (r * 100) + '%' : '0';
    $('#pct').textContent = current ? Math.round(r * 100) + '%' : '';
    if (Math.abs(scrollY - lastY) > 6) { $('#bar').classList.toggle('hidden', scrollY > lastY && scrollY > 120); lastY = scrollY; }
    let idx = -1;
    for (let i = 0; i < headings.length; i++) { if (headings[i].getBoundingClientRect().top < innerHeight * 0.4) idx = i; else break; }
    $('#tocList').querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === idx));
    if (current) { clearTimeout(saveTimer); const id = current.id; saveTimer = setTimeout(() => store.set('reader:pos:' + id, r), 300); }
  }
  addEventListener('scroll', onScroll, { passive: true });
  book.addEventListener('click', (e) => { if (current && !e.target.closest('a,label,button')) $('#bar').classList.toggle('hidden'); });

  refreshShelf().then(() => {
    const want = location.hash.slice(1) || store.get('reader:last', null);
    const id = shelf.some((b) => b.id === want) ? want : (shelf.find((b) => !b.server) || {}).id;
    if (id) openBook(id); else welcome();
  });
})();
</script>
</body>
</html>
