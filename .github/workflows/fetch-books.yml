name: Fetch bookshelf books

# 下載 scripts/books.json 列出的公版書到 docs/books，並提交回同一個分支
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/books.json
      - scripts/fetch_books.py
      - .github/workflows/fetch-books.yml

permissions:
  contents: write

concurrency:
  group: fetch-books
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: pip install pillow
      - name: Download books
        timeout-minutes: 20
        run: python scripts/fetch_books.py
      - name: Commit books
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/books
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update bookshelf books from Project Gutenberg"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
